name: E2E Quality Gate

# 🚀 1. TRIGGERS: Run on Pull Requests to main, or manually via a button
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  # 🪟 JOB 1: Execute the tests on your local Windows machine (Handles your local Docker ReportPortal)
  playwright-tests:
    timeout-minutes: 15 
    runs-on: self-hosted

    env:
      # 🛡️ THE HOOK: This triggers the headless & memory-safe logic we wrote in AiTriage.cs
      CI: true 

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' 

      - name: 🏗️ Build Framework
        run: dotnet build src/ --configuration Release

      - name: 🌐 Install Playwright Browsers & OS Dependencies
        # Executing the officially generated PowerShell script from your .NET 10 Release folder
        run: pwsh src/bin/Release/net10.0/playwright.ps1 install --with-deps

      - name: 🧪 Execute UI Test Suite
        env:
          # Streams live telemetry straight into your localhost ReportPortal container
          ReportPortal_Server_Authentication_Uuid: ${{ secrets.RP_API_KEY }}
        run: dotnet test src/ --configuration Release --no-build --verbosity normal --logger:"trx;LogFileName=TestResults.trx" --results-directory ./TestResults

      - name: 📤 Archive Raw Allure Results
        # Collects the generated JSON/XML chunks before the runner cleans up
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-allure-results
          path: src/bin/Release/net10.0/allure-results/
          retention-days: 1

      - name: 📊 Upload Raw TRX Test Results (On Failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nunit-test-results
          path: '**/TestResults/*.trx'
          retention-days: 7

  # 🐧 JOB 2: Process and host the report on GitHub's Linux Cloud (Bypasses the Container Action error)
  generate-report:
    runs-on: ubuntu-latest
    needs: playwright-tests # 🚀 Grid Lock: Forces this job to wait until the test execution finishes
    if: always() # Guarantees the report is generated and hosted even if tests fail

    # 🔐 THE FIX: Grants the GITHUB_TOKEN write access to push the compiled site to your gh-pages branch
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Raw Allure Results
        uses: actions/download-artifact@v4
        with:
          name: raw-allure-results
          path: allure-results-input

      - name: 📊 Generate Allure Report HTML
        # This Docker-based action executes safely now because it is running on native Linux
        uses: simple-elf/allure-report-action@master
        id: allure-report
        with:
          allure_results: allure-results-input
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: 🚀 Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history