name: E2E Quality Gate

# 🚀 1. TRIGGERS: Run on Pull Requests to main, or manually via a button
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  playwright-tests:
    timeout-minutes: 15 
    # 🚀 CHANGED: This tells GitHub to route the job to your local machine!
    runs-on: self-hosted

    # 🔐 THE FIX: Explicitly grant the GITHUB_TOKEN write access to push the Allure report
    permissions:
      contents: write

    env:
      # 🛡️ THE HOOK: This triggers the headless & memory-safe logic we wrote in AiTriage.cs
      CI: true 

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' 

      - name: 🏗️ Build Framework
        run: dotnet build src/ --configuration Release

      - name: 🌐 Install Playwright Browsers & OS Dependencies
        # Executing the officially generated PowerShell script from the .NET 10 Release folder
        run: pwsh src/bin/Release/net10.0/playwright.ps1 install --with-deps

      - name: 🧪 Execute UI Test Suite
        # Runs the tests using the compiled DLLs without rebuilding
        run: dotnet test src/ --configuration Release --no-build --verbosity normal --logger:"trx;LogFileName=TestResults.trx" --results-directory ./TestResults

      - name: 📊 Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          # Pointing directly to the directory where your framework drops the results
          allure_results: src/bin/Release/net10.0/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: 🚀 Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: 📊 Upload Test Results (On Failure)
        # Always run this step even if the tests fail, so we can see what broke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nunit-test-results
          path: '**/TestResults/*.trx'
          retention-days: 7